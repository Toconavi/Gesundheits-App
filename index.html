<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wechseljahre-Tagebuch</title>
<meta name="theme-color" content="#2a8a98">
<meta name="description" content="Privates Wechseljahre-Tagebuch – lokal auf diesem Gerät gespeichert.">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<style>
/* Layout idea: a phone-first diary with a bottom tab bar; Oestrogel is always teal, Utrogestan always rose, as on the doctor's leaflet. */
:root{
  --bg:#f2f5f6; --surface:#ffffff; --ink:#1b2a31; --muted:#5d6e76; --line:#dbe3e6; --soft:#e8eef0;
  --estro:#2a8a98; --estro-soft:#dcf0f2; --utro:#cf6377; --utro-soft:#f9e3e7;
  --good:#3a8a57; --warn:#b97c12; --bad:#bb4039; --good-soft:#e1f1e6; --warn-soft:#f8ecd4; --bad-soft:#f6dfdd;
  --display:"Fraunces", Georgia, "Times New Roman", serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1518; --surface:#162025; --ink:#e4edf0; --muted:#94a5ad; --line:#26343a; --soft:#1d2a30;
    --estro:#5bbfcb; --estro-soft:#173a3f; --utro:#ee8fa0; --utro-soft:#43232b;
    --good:#6cc28a; --warn:#e2ac4b; --bad:#ec7b73; --good-soft:#1b3424; --warn-soft:#3a2e15; --bad-soft:#3d1f1d;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1518; --surface:#162025; --ink:#e4edf0; --muted:#94a5ad; --line:#26343a; --soft:#1d2a30;
  --estro:#5bbfcb; --estro-soft:#173a3f; --utro:#ee8fa0; --utro-soft:#43232b;
  --good:#6cc28a; --warn:#e2ac4b; --bad:#ec7b73; --good-soft:#1b3424; --warn-soft:#3a2e15; --bad-soft:#3d1f1d;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
body{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--estro);outline-offset:2px}
h1,h2,h3{text-wrap:balance;margin:0}
h1{font-family:var(--display);font-weight:600;font-size:1.65rem;line-height:1.15}
h2{font-family:var(--display);font-weight:600;font-size:1.2rem}
h3{font-size:.95rem;font-weight:600}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:560px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 16px 16px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:14px}
.eyebrow{font-size:.78rem;color:var(--muted);font-weight:600;letter-spacing:.02em}
.stack{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.card.estro{border-left:5px solid var(--estro)}
.card.utro{border-left:5px solid var(--utro)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.between{justify-content:space-between}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.tiny{font-size:.75rem}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--muted);font-weight:500}
input[type=text],input[type=date],input[type=time],input[type=number],select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 10px;color:var(--ink);width:100%;min-width:0}
textarea{min-height:76px;resize:vertical}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 16px;font-weight:600;font-size:.92rem}
.btn.primary{background:var(--estro);border-color:var(--estro);color:#fff}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn:disabled{opacity:.45;cursor:default}
.iconbtn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:inline-grid;place-items:center;font-size:1.1rem;line-height:1}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:.88rem;font-weight:500}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.estro .chip[aria-pressed="true"]{background:var(--estro);border-color:var(--estro);color:#fff}
.utro .chip[aria-pressed="true"]{background:var(--utro);border-color:var(--utro);color:#fff}
.seg{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 0;font-weight:600;font-size:.9rem}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.take{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:none;padding:0}
.ring{width:46px;height:46px;flex:none;border-radius:50%;border:2.5px solid currentColor;display:grid;place-items:center;font-size:1.3rem;font-weight:700}
.estro .ring{color:var(--estro)} .utro .ring{color:var(--utro)}
.estro .on .ring{background:var(--estro);color:#fff;border-color:var(--estro)}
.utro .on .ring{background:var(--utro);color:#fff;border-color:var(--utro)}
.take .t1{font-weight:700;font-size:1.05rem}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.stepper button{border:0;background:var(--surface);width:38px;height:36px;font-size:1.15rem}
.stepper span{min-width:44px;text-align:center;font-weight:700}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:.78rem;font-weight:600;white-space:nowrap}
.sev0{background:var(--good-soft);color:var(--good)}
.sev1{background:var(--soft);color:var(--muted)}
.sev2{background:var(--warn-soft);color:var(--warn)}
.sev3{background:var(--bad-soft);color:var(--bad)}
.note{border-radius:12px;padding:10px 12px;font-size:.88rem;background:var(--soft)}
.note.warn{background:var(--warn-soft);color:var(--ink)}
.saved{font-size:.78rem;color:var(--muted);min-height:1em}
.divider{height:1px;background:var(--line);margin:12px 0}
/* tab bar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:5}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none;color:var(--muted);font-size:.72rem;font-weight:600;padding:4px 0;border-radius:10px}
nav.tabs a svg{width:22px;height:22px}
nav.tabs a[aria-current="page"]{color:var(--estro)}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .wd{font-size:.72rem;color:var(--muted);text-align:center;font-weight:600;padding-bottom:2px}
.cal button{aspect-ratio:1/1.08;border:1px solid var(--line);background:var(--surface);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:0;position:relative}
.cal button.out{visibility:hidden}
.cal button.today{border-color:var(--ink);border-width:2px}
.cal button.future{opacity:.45}
.cal .d{font-size:.85rem;font-weight:600}
.dots{display:flex;gap:3px}
.dot{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--line)}
.dot.e.on{background:var(--estro);border-color:var(--estro)}
.dot.u.on{background:var(--utro);border-color:var(--utro)}
.dot.u.na{border-style:dotted;opacity:.5}
.bleed{position:absolute;bottom:4px;left:30%;right:30%;height:3px;border-radius:2px;background:var(--bad)}
.bleed.spot{opacity:.45}
/* tiles */
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.tile .v{font-family:var(--display);font-size:1.6rem;font-weight:600;line-height:1.1}
.tile .l{font-size:.78rem;color:var(--muted);font-weight:600}
.bar{height:8px;border-radius:4px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:9.5px;font-family:var(--body)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.78rem;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.items .it{display:grid;grid-template-columns:1fr 112px;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.items .it:last-child{border-bottom:0}
.mrsq{padding:10px 0;border-bottom:1px solid var(--line)}
.mrsq:last-child{border-bottom:0}
.mrsq .seg button{font-size:.75rem;padding:8px 0;font-weight:600}
.mrsq .seg button[aria-pressed="true"][data-v="0"]{background:var(--good);border-color:var(--good);color:#fff}
.mrsq .seg button[aria-pressed="true"][data-v="1"]{background:#8aa2ac;border-color:#8aa2ac;color:#fff}
.mrsq .seg button[aria-pressed="true"][data-v="2"]{background:var(--warn);border-color:var(--warn);color:#fff}
.mrsq .seg button[aria-pressed="true"][data-v="3"],.mrsq .seg button[aria-pressed="true"][data-v="4"]{background:var(--bad);border-color:var(--bad);color:#fff}
.list .li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.list .li:last-child{border-bottom:0}
.welcome{background:linear-gradient(160deg,var(--estro-soft),var(--surface) 70%);border-color:var(--estro)}
.banner{background:var(--warn-soft);border:1px solid var(--warn);border-radius:12px;padding:10px 12px;font-size:.88rem;display:flex;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px}
.status{display:inline-flex;align-items:center;gap:6px;font-size:.75rem;color:var(--muted);font-weight:600}
.status i{width:8px;height:8px;border-radius:50%;background:var(--warn)}
.status.cloud i{background:var(--good)}
pre.report{white-space:pre-wrap;font-family:var(--body);font-size:.85rem;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;margin:0;max-height:420px;overflow:auto}
.modal{position:fixed;inset:0;background:rgba(10,20,25,.45);display:grid;place-items:center;padding:16px;z-index:20}
.modal .card{max-width:420px;width:100%}
ul.tips{margin:6px 0 0;padding-left:18px}
ul.tips li{margin:4px 0}
a{color:var(--estro)}
@media (max-width:380px){.tiles{grid-template-columns:1fr 1fr}.items .it{grid-template-columns:1fr 92px}}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<nav class="tabs" aria-label="Bereiche"><div class="in" id="tabs"></div></nav>
<div id="modal"></div>

<script>
(function(){
"use strict";
/* ---------- constants ---------- */
const LS_KEY = "wj-tagebuch-v1";
const PUMP_G = 1.25;      // 1 Hub Oestrogel = 1.25 g Gel = 0.75 mg Estradiol
const PUMP_MG = 0.75;
const MRS = [
  ["Hitzewallungen, Schwitzen","Aufsteigende Hitze, Schweissausbrüche"],
  ["Herzbeschwerden","Herzklopfen, Herzrasen, Herzstolpern, Beklemmung"],
  ["Schlafstörungen","Ein- oder Durchschlafprobleme, zu frühes Aufwachen"],
  ["Depressive Verstimmung","Mutlosigkeit, Traurigkeit, Antriebslosigkeit, Stimmungsschwankungen"],
  ["Reizbarkeit","Nervosität, innere Anspannung, Aggressivität"],
  ["Ängstlichkeit","Innere Unruhe, Panik"],
  ["Erschöpfung","Körperlich und geistig: Leistung, Gedächtnis, Konzentration"],
  ["Sexualprobleme","Veränderung von Verlangen, Aktivität, Befriedigung"],
  ["Harnwegsbeschwerden","Beschwerden beim Wasserlassen, Harndrang, Harnverlust"],
  ["Trockenheit der Scheide","Trockenheitsgefühl, Brennen, Beschwerden beim Verkehr"],
  ["Gelenk- und Muskelbeschwerden","Gelenkschmerzen, rheumaähnliche Beschwerden"]
];
const LEVELS = ["keine","leicht","mittel","stark","sehr stark"];
const SUB = {
  soma:{name:"Körperlich",idx:[0,1,2,10],cut:[2,4,8]},
  psych:{name:"Psychisch",idx:[3,4,5,6],cut:[1,3,6]},
  uro:{name:"Urogenital",idx:[7,8,9],cut:[0,1,3]}
};
const TOTAL_CUT=[4,8,15];
const SEV_LABEL=["keine/kaum","leicht","mittel","stark"];
const SITES=["Arme","Schultern","Oberschenkel"];
const BLEED=[["none","keine"],["spot","Schmier"],["light","leicht"],["heavy","stark"]];
const FX=["Brustspannen","Kopfschmerzen","Blähungen","Übelkeit","Hautreizung","Müdigkeit tagsüber"];
const SCALE5={sl:["sehr schlecht","schlecht","mittel","gut","sehr gut"],mo:["sehr tief","tief","mittel","gut","sehr gut"],en:["sehr wenig","wenig","mittel","gut","sehr gut"]};

const DEF_SETTINGS = {
  name:"", welcomed:false, start:"", estroPumps:2, utroMode:"none", ver:4, utroMg:100, utroFrom:1, utroTo:14,
  bottleDate:"", bottleSize:80, packDate:"", packSize:30,
  questions:[{id:"q1",text:"Vaginale lokale Therapie bei Trockenheit oder Harnwegsbeschwerden?",done:false}]
};

/* ---------- date helpers ---------- */
const pad=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parse=s=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d);};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d);};
const today=()=>iso(new Date());
const dayNum=s=>Math.round(parse(s).getTime()/864e5);
const diffDays=(a,b)=>dayNum(b)-dayNum(a);
const fmtLong=s=>parse(s).toLocaleDateString("de-CH",{weekday:"long",day:"numeric",month:"long"});
const fmtShort=s=>parse(s).toLocaleDateString("de-CH",{day:"numeric",month:"short"});
const fmtDate=s=>parse(s).toLocaleDateString("de-CH",{day:"2-digit",month:"2-digit",year:"numeric"});
const nowTime=()=>{const d=new Date();return pad(d.getHours())+":"+pad(d.getMinutes());};
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const r1=n=>Math.round(n*10)/10;
const fmt1=n=>r1(n).toLocaleString("de-CH");

/* ---------- state ---------- */
let S = {settings:clone(DEF_SETTINGS), days:{}, mrs:[]};
let REAL = null;          // saved real state while demo is shown
let demo = false;
let view = "heute";
let cur = today();        // date being edited
let calMonth = today().slice(0,7);
let range = 90;
let mrsDraft = null;
let reportRange = "all";

function clone(o){return JSON.parse(JSON.stringify(o));}
/* Frühere Versionen hatten einen fest hinterlegten Vornamen als Standard. Er wird nur als Prüfsumme
   verglichen (damit kein Name im Code steht) und entfernt; alle übrigen Daten bleiben unverändert. */
const OLD_DEFAULT_NAME_HASH="8b883ed4";
function nameHash(s){let x=0x811c9dc5;for(const c of String(s).trim().toLowerCase()){x^=c.codePointAt(0);x=Math.imul(x,0x01000193)>>>0;}return x.toString(16);}
function migrate(st){if(!st.ver||st.ver<2){st.utroMode="none";st.ver=2;} if(st.ver<3){st.ver=3;}
  if(st.ver<4){if(st.name&&nameHash(st.name)===OLD_DEFAULT_NAME_HASH)st.name="";st.ver=4;}
  st.name=typeof st.name==="string"?st.name.trim():""; return st;}
function mergeSettings(src){const st=Object.assign(clone(DEF_SETTINGS),src||{}); if(!src||src.ver==null) st.ver=3; return migrate(st);}

/* ---------- local storage ---------- */
function lsLoad(){
  try{const raw=localStorage.getItem(LS_KEY); if(raw){const o=JSON.parse(raw); return o;}}catch(e){}
  return null;
}
/* Alle Daten (Tage, Notizen, Fragebögen, Einstellungen, Name) werden ausschliesslich hier lokal gespeichert. */
let lsWarned=false;
function lsSave(){
  if(demo) return true;
  try{localStorage.setItem(LS_KEY,JSON.stringify(S)); lsWarned=false; return true;}
  catch(e){ if(!lsWarned){lsWarned=true; try{toast("Speichern auf diesem Gerät ist gerade nicht möglich (Browser-Speicher voll oder gesperrt). Bitte eine Sicherung herunterladen.");}catch(_){}} return false; }
}
const loaded=lsLoad();
if(loaded){S.settings=mergeSettings(loaded.settings);S.days=loaded.days||{};S.mrs=loaded.mrs||[];lsSave();}

/* ---------- persistence API ---------- */
function saveDay(date){ lsSave(); flashSaved(); }
function saveMrs(m){ lsSave(); }
function deleteMrs(id){ S.mrs=S.mrs.filter(m=>m.id!==id); lsSave(); }
function saveSettings(){ lsSave(); }

/* ---------- domain helpers ---------- */
function getDay(date){
  return S.days[date]||{date,e:{on:false,p:S.settings.estroPumps,t:"",s:""},u:{on:false,mg:S.settings.utroMg,t:""},hf:null,sl:null,mo:null,en:null,bl:"",fx:[],note:""};
}
function ensureDay(date){ if(!S.days[date]) S.days[date]=getDay(date); return S.days[date]; }
function utroDue(date){
  const s=S.settings;
  if(s.utroMode==="none") return false;
  if(s.utroMode==="daily") return true;
  const d=parse(date).getDate();
  return d>=Number(s.utroFrom)&&d<=Number(s.utroTo);
}
function sev(v,cut){ if(v<=cut[0])return 0; if(v<=cut[1])return 1; if(v<=cut[2])return 2; return 3; }
function mrsTotal(m){return m.s.reduce((a,b)=>a+(b||0),0);}
function mrsSub(m,k){return SUB[k].idx.reduce((a,i)=>a+(m.s[i]||0),0);}
function sevPill(level,text){const cls=["sev0","sev1","sev2","sev3"][level];return `<span class="pill ${cls}">${esc(text||SEV_LABEL[level])}</span>`;}
function sortedMrs(){return S.mrs.slice().sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:(a.ts||0)-(b.ts||0));}
function therapyStart(){
  if(S.settings.start) return S.settings.start;
  const ks=Object.keys(S.days).filter(k=>S.days[k].e&&S.days[k].e.on).sort();
  return ks[0]||"";
}
function streak(){
  let n=0,d=today();
  if(!(S.days[d]&&S.days[d].e.on)) d=addDays(d,-1);
  while(S.days[d]&&S.days[d].e&&S.days[d].e.on){n++;d=addDays(d,-1);}
  return n;
}
function daysInRange(from,to){const out=[];let d=from;while(d<=to){out.push(d);d=addDays(d,1);}return out;}
function rangeFrom(nDays){
  const st=therapyStart()||Object.keys(S.days).sort()[0]||today();
  if(nDays==="all") return st;
  const f=addDays(today(),-(nDays-1));
  return f<st?st:f;
}
function adherence(from,to){
  const ds=daysInRange(from,to);
  let eDue=0,eOn=0,uDue=0,uOn=0;
  ds.forEach(d=>{
    const day=S.days[d];
    // today counts only if already logged
    if(d===today()&&!(day&&day.e.on)){} else {eDue++; if(day&&day.e.on)eOn++;}
    if(utroDue(d)){ if(d===today()&&!(day&&day.u.on)){} else {uDue++; if(day&&day.u.on)uOn++;} }
  });
  return {eDue,eOn,uDue,uOn};
}
function gelSupply(){
  const s=S.settings; if(!s.bottleDate) return null;
  const total=Math.floor(s.bottleSize/PUMP_G);
  let used=0;
  Object.values(S.days).forEach(d=>{if(d.date>=s.bottleDate&&d.e&&d.e.on) used+=Number(d.e.p)||0;});
  const left=Math.max(0,total-used);
  const per=Number(s.estroPumps)||1;
  const daysLeft=Math.floor(left/per);
  return {total,used,left,daysLeft,empty:addDays(today(),daysLeft)};
}
function capSupply(){
  const s=S.settings; if(!s.packDate||s.utroMode==="none") return null;
  let used=0;
  Object.values(S.days).forEach(d=>{if(d.date>=s.packDate&&d.u&&d.u.on) used++;});
  const left=Math.max(0,Number(s.packSize)-used);
  // estimate days to empty, counting only due days
  let n=0,d=addDays(today(),1),rem=left;
  if(!(S.days[today()]&&S.days[today()].u.on)&&utroDue(today())){ if(rem>0){rem--;} }
  while(rem>0&&n<400){ if(utroDue(d)) rem--; if(rem>0) d=addDays(d,1); n++; }
  return {total:Number(s.packSize),used,left,empty:left===0?today():d};
}

/* ---------- small UI helpers ---------- */
let savedTimer=null;
function flashSaved(){
  const el=document.getElementById("saved"); if(!el) return;
  el.textContent=demo?"Beispiel – wird nicht gespeichert":"Auf diesem Gerät gespeichert";
  clearTimeout(savedTimer); savedTimer=setTimeout(()=>{if(el)el.textContent="";},1800);
}
function toast(msg){
  const m=document.getElementById("modal");
  m.innerHTML=`<div class="modal" data-action="closeModal"><div class="card stack"><div>${esc(msg)}</div><div class="row" style="justify-content:flex-end"><button class="btn" data-action="closeModal">OK</button></div></div></div>`;
}
function confirmBox(msg,yesLabel,onYes){
  const m=document.getElementById("modal");
  m.innerHTML=`<div class="modal"><div class="card stack"><div>${esc(msg)}</div><div class="row" style="justify-content:flex-end"><button class="btn ghost" data-action="closeModal">Abbrechen</button><button class="btn danger" id="yesBtn">${esc(yesLabel)}</button></div></div></div>`;
  document.getElementById("yesBtn").onclick=()=>{m.innerHTML="";onYes();};
}

function greeting(){
  const n=(S.settings.name||"").trim(); const h=new Date().getHours();
  if(h<5||h>=22) return n?`Gute Nacht, ${n}`:"Gute Nacht";
  if(h<11) return n?`Guten Morgen, ${n}`:"Guten Morgen";
  if(h<17) return n?`Hallo ${n}`:"Hallo";
  return n?`Guten Abend, ${n}`:"Guten Abend";
}
function subGreeting(d){
  if(d.e.on){const st=streak(); return st>2?`Oestrogel ist erledigt, ${st} Tage in Folge. Schön!`:"Oestrogel ist für heute erledigt. Schön!";}
  return new Date().getHours()<12?"Oestrogel steht heute noch aus.":"Oestrogel ist heute noch nicht abgehakt.";
}
function welcomeCard(){
  if(S.settings.welcomed||demo) return "";
  const n=(S.settings.name||"").trim();
  return `<section class="card stack welcome" aria-label="Willkommen">
    <h2>Schön, dass du da bist${n?", "+esc(n):""}</h2>
    <div class="small">Hier hältst du fest, wann du Oestrogel aufträgst und wie es dir geht. Aus deinen Einträgen entstehen Verläufe und ein Bericht für den nächsten Arzttermin.</div>
    <ul class="tips small"><li>Jeden Tag: Oestrogel abhaken, Befinden kurz eintragen.</li><li>Alle 2–4 Wochen: den Fragebogen ausfüllen, falls vorhanden zuerst einen bereits ausgefüllten Bogen als Ausgangswert.</li><li>Unter «Analyse» siehst du, was sich verändert.</li></ul>
    <button class="btn primary" data-action="welcomeOk" style="align-self:flex-start">Los geht's</button></section>`;
}
function supplyHint(){
  const g=gelSupply(),c=capSupply(); const out=[];
  if(g&&g.daysLeft<=10) out.push(`Oestrogel reicht noch etwa <b>${g.daysLeft} Tage</b> (${g.left} Hübe).`);
  if(c&&c.left<=5) out.push(`Noch <b>${c.left} Utrogestan-Kapseln</b> in der Packung.`);
  return out.length?`<div class="note warn">${out.join("<br>")} Rezept oder Nachschub einplanen.</div>`:"";
}

/* ---------- VIEW: Kalender ---------- */
function vKalender(){
  const [y,m]=calMonth.split("-").map(Number);
  const first=new Date(y,m-1,1); const nDays=new Date(y,m,0).getDate();
  const lead=(first.getDay()+6)%7;
  const t=today();
  let cells="";
  for(let i=0;i<lead;i++) cells+=`<button class="out" tabindex="-1" aria-hidden="true"></button>`;
  let eOn=0,uOn=0,uDue=0,bl=0,hfs=[],past=0;
  for(let d=1;d<=nDays;d++){
    const ds=`${y}-${pad(m)}-${pad(d)}`; const day=S.days[ds]; const fut=ds>t;
    const due=utroDue(ds);
    const e=day&&day.e.on, u=day&&day.u.on;
    if(!fut){past++; if(e)eOn++; if(due){uDue++;} if(u)uOn++; if(day&&day.bl&&day.bl!=="none")bl++; if(day&&day.hf!=null)hfs.push(day.hf);}
    const blc=day&&day.bl&&day.bl!=="none"?`<span class="bleed ${day.bl==="spot"?"spot":""}"></span>`:"";
    cells+=`<button class="${ds===t?"today":""} ${fut?"future":""}" data-action="openDay" data-v="${ds}" ${fut?"disabled":""} aria-label="${fmtLong(ds)}${e?", Oestrogel":""}${u?", Utrogestan":""}">
      <span class="d num">${d}</span><span class="dots"><span class="dot e ${e?"on":""}"></span>${S.settings.utroMode!=="none"?`<span class="dot u ${u?"on":""} ${!due&&!u?"na":""}"></span>`:""}</span>${blc}</button>`;
  }
  const mname=first.toLocaleDateString("de-CH",{month:"long",year:"numeric"});
  const isCur=calMonth===t.slice(0,7);
  const avgHf=hfs.length?fmt1(hfs.reduce((a,b)=>a+b,0)/hfs.length):"–";
  return `${demoBanner()}
  <div class="top"><div><div class="eyebrow">Kalender</div><h1>${esc(mname)}</h1></div>
   <div class="row" style="gap:6px;flex-wrap:nowrap"><button class="iconbtn" data-action="monPrev" aria-label="Vorheriger Monat">‹</button><button class="iconbtn" data-action="monNext" aria-label="Nächster Monat" ${isCur?"disabled":""}>›</button></div></div>
  <div class="stack">
   <div class="card stack">
    <div class="cal">${["Mo","Di","Mi","Do","Fr","Sa","So"].map(w=>`<div class="wd">${w}</div>`).join("")}${cells}</div>
    <div class="legend"><span><i style="background:var(--estro)"></i>Oestrogel</span>${S.settings.utroMode!=="none"?`<span><i style="background:var(--utro)"></i>Utrogestan</span>`:""}<span><i style="background:var(--bad);height:3px;vertical-align:2px"></i>Blutung</span></div>
    <div class="small muted">Tag antippen, um den Eintrag zu ergänzen.</div>
   </div>
   <div class="tiles">
    <div class="tile"><div class="l">Oestrogel</div><div class="v num">${eOn}/${past}</div><div class="small muted">Tage</div></div>
    ${S.settings.utroMode!=="none"?`<div class="tile"><div class="l">Utrogestan</div><div class="v num">${uOn}/${uDue}</div><div class="small muted">vorgesehene Tage</div></div>`:""}
    <div class="tile"><div class="l">Ø Hitzewallungen</div><div class="v num">${avgHf}</div><div class="small muted">pro erfasstem Tag</div></div>
    <div class="tile"><div class="l">Blutungstage</div><div class="v num">${bl}</div><div class="small muted">inkl. Schmierblutung</div></div>
   </div>
  </div>`;
}

/* ---------- charts ---------- */
function lineChart(o){
  const w=340,h=o.h||160,pl=26,pr=10,pt=8,pb=20;
  const X=v=>pl+(v-o.x0)/((o.x1-o.x0)||1)*(w-pl-pr);
  const Y=v=>h-pb-(v-o.y0)/((o.y1-o.y0)||1)*(h-pt-pb);
  let s=`<svg viewBox="0 0 ${w} ${h}" class="chart" role="img" aria-label="${esc(o.label||"Diagramm")}">`;
  (o.bands||[]).forEach(b=>{s+=`<rect x="${pl}" y="${Y(b.to)}" width="${w-pl-pr}" height="${Y(b.from)-Y(b.to)}" fill="${b.c}" opacity="${b.o||.5}"/>`;});
  (o.yTicks||[]).forEach(t=>{s+=`<line x1="${pl}" x2="${w-pr}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--line)" stroke-width="1"/><text x="${pl-5}" y="${Y(t)+3}" text-anchor="end">${t}</text>`;});
  (o.xTicks||[]).forEach(t=>{s+=`<text x="${X(t.v)}" y="${h-5}" text-anchor="middle">${esc(t.l)}</text>`;});
  o.series.forEach(se=>{
    const pts=se.pts.filter(p=>p[1]!=null); if(!pts.length) return;
    const dpath=pts.map((p,i)=>(i?"L":"M")+X(p[0]).toFixed(1)+" "+Y(p[1]).toFixed(1)).join(" ");
    if(se.area&&pts.length>1) s+=`<path d="${dpath} L${X(pts[pts.length-1][0]).toFixed(1)} ${Y(o.y0)} L${X(pts[0][0]).toFixed(1)} ${Y(o.y0)} Z" fill="${se.c}" opacity=".12"/>`;
    s+=`<path d="${dpath}" fill="none" stroke="${se.c}" stroke-width="${se.wd||2}" stroke-linejoin="round" stroke-linecap="round" ${se.dash?'stroke-dasharray="4 3"':""}/>`;
    if(se.dots) pts.forEach(p=>{s+=`<circle cx="${X(p[0])}" cy="${Y(p[1])}" r="3" fill="var(--surface)" stroke="${se.c}" stroke-width="2"/>`;});
    const L=pts[pts.length-1];
    s+=`<circle cx="${X(L[0])}" cy="${Y(L[1])}" r="4" fill="${se.c}"/>`;
    if(se.endLabel) s+=`<text x="${Math.min(X(L[0])+0,w-pr)}" y="${Y(L[1])-8}" text-anchor="end" style="fill:${se.c};font-weight:700;font-size:11px">${esc(se.endLabel)}</text>`;
  });
  return s+"</svg>";
}
function rolling(dates,key,win){
  return dates.map((d,i)=>{
    const vals=[];for(let j=Math.max(0,i-win+1);j<=i;j++){const day=S.days[dates[j]];if(day&&day[key]!=null)vals.push(day[key]);}
    return [dayNum(d),vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:null];
  });
}
function xTicksFor(from,to){
  const n=diffDays(from,to); const step=n<=14?3:n<=45?7:n<=120?21:60; const out=[];
  for(let i=0;i<=n;i+=step) out.push({v:dayNum(addDays(from,i)),l:fmtShort(addDays(from,i))});
  return out;
}

function sevLabelTotal(t){return ["keine/kaum","leichte","mittlere","starke"][sev(t,TOTAL_CUT)]+" Beschwerden";}
function mrsCard(ms){

  }
  return `<div class="card stack"><div class="row between"><h2>Menopause Rating Scale</h2><span class="small muted">${ms.length} ${ms.length===1?"Bogen":"Bögen"}</span></div>
   ${chart}

function dailyCard(dates,from,to){

function niceTicks(max){const step=max<=6?1:max<=12?2:5;const o=[];for(let i=0;i<=max;i+=step)o.push(i);return o;}

function avg(a){return a.length?a.reduce((x,y)=>x+y,0)/a.length:null;}
function insightsCard(from,to){
  const out=[];
  const vals=(f,t,k)=>daysInRange(f,t).map(d=>S.days[d]&&S.days[d][k]).filter(v=>v!=null);
  // flushes: last 14 vs previous 14
  const a=vals(addDays(to,-13),to,"hf"), b=vals(addDays(to,-27),addDays(to,-14),"hf");
  if(a.length>=5&&b.length>=5){const A=avg(a),B=avg(b);const ch=B?Math.round((A-B)/B*100):0;
    out.push(`Hitzewallungen in den letzten 14 Tagen: Ø <b>${fmt1(A)}</b> pro Tag, davor ${fmt1(B)} (${ch<=0?"":"+"}${ch} %).`);}
  // sleep after Utrogestan
  if(S.settings.utroMode!=="none"){
    const w=[],wo=[];
    daysInRange(from,to).forEach(d=>{const day=S.days[d],prev=S.days[addDays(d,-1)]; if(day&&day.sl){ if(prev&&prev.u&&prev.u.on) w.push(day.sl); else wo.push(day.sl);} });
    if(w.length>=5&&wo.length>=3) out.push(`Schlaf nach einem Utrogestan-Abend: Ø <b>${fmt1(avg(w))}</b> von 5, sonst ${fmt1(avg(wo))}.`);
  }
  // dose comparison
  const byDose={};
  daysInRange(from,to).forEach(d=>{const day=S.days[d]; if(day&&day.e.on&&day.hf!=null){(byDose[day.e.p]=byDose[day.e.p]||[]).push(day.hf);} });
  const doses=Object.keys(byDose).filter(k=>byDose[k].length>=5);
  if(doses.length>=2) out.push("Hitzewallungen je Oestrogel-Dosis: "+doses.map(k=>`${k} ${k==1?"Hub":"Hübe"} Ø <b>${fmt1(avg(byDose[k]))}</b>`).join(", ")+". Dosisänderungen nur mit der Ärztin.");
  // MRS
  const ms=sortedMrs();
  if(ms.length>=2){const f=ms[0],l=ms[ms.length-1];const tf=mrsTotal(f),tl=mrsTotal(l);
    out.push(`MRS-Summe von <b>${tf}</b> auf <b>${tl}</b>${tf?` (${tl<=tf?"−":"+"}${Math.abs(Math.round((tl-tf)/tf*100))} %)`:""} seit ${fmtDate(f.date)}.`);
    let best=-1,bi=-1,worst=-1,wi=-1; MRS.forEach((q,i)=>{const d=(f.s[i]||0)-(l.s[i]||0); if(d>best){best=d;bi=i;} if((l.s[i]||0)>worst){worst=l.s[i]||0;wi=i;}});
    if(best>0) out.push(`Grösste Besserung: <b>${MRS[bi][0]}</b> (${LEVELS[f.s[bi]]} → ${LEVELS[l.s[bi]]}).`);
    if(worst>=2) out.push(`Am stärksten zuletzt: <b>${MRS[wi][0]}</b> (${LEVELS[worst]}). Ein Thema für den nächsten Termin.`);
  }
  // side effects
  const fxc={}; daysInRange(from,to).forEach(d=>{const day=S.days[d]; (day&&day.fx||[]).forEach(x=>fxc[x]=(fxc[x]||0)+1);});
  const topfx=Object.entries(fxc).sort((x,y)=>y[1]-x[1]).slice(0,3);
  if(topfx.length) out.push("Häufigste Begleiterscheinungen: "+topfx.map(([k,v])=>`${k} (${v} Tage)`).join(", ")+".");
  if(!out.length) return "";
  return `<div class="card stack"><h2>Erkenntnisse</h2><ul class="tips">${out.map(x=>`<li>${x}</li>`).join("")}</ul></div>`;
}

  }

  L.push(bl.length?bl.map(d=>`${fmtDate(d.date)} ${lbl[d.bl]}`).join("; "):"keine erfasst");
  const fxc={}; ds.forEach(d=>(d.fx||[]).forEach(x=>fxc[x]=(fxc[x]||0)+1));
  if(Object.keys(fxc).length){L.push(""); L.push("BEGLEITERSCHEINUNGEN"); L.push(Object.entries(fxc).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`${k}: ${v} Tage`).join(", "));}
  const notes=ds.filter(d=>d.note&&d.note.trim()).slice(-8);
  if(notes.length){L.push(""); L.push("NOTIZEN"); notes.forEach(d=>L.push(`${fmtDate(d.date)}: ${d.note.trim()}`));}
  const qs=s.questions.filter(q=>!q.done);
  if(qs.length){L.push(""); L.push("FRAGEN"); qs.forEach(q=>L.push("– "+q.text));}
  return L.join("\n");
}

/* ---------- demo data ---------- */
function makeDemo(){
  const D={settings:Object.assign(clone(DEF_SETTINGS),{start:addDays(today(),-62),bottleDate:addDays(today(),-24),packDate:addDays(today(),-20),estroPumps:2}),days:{},mrs:[]};
  let seed=7; const rnd=()=>{seed=(seed*9301+49297)%233280;return seed/233280;};
  for(let i=62;i>=0;i--){
    const d=addDays(today(),-i); const prog=(62-i)/62;
    const eOn=rnd()>0.06||i===0, uOn=false; rnd();
    const hf=Math.max(0,Math.round(7*(1-prog*0.75)+(rnd()*3-1.5)));
    const sl=Math.min(5,Math.max(1,Math.round(2+prog*2+(rnd()*1.6-0.8))));
    const mo=Math.min(5,Math.max(1,Math.round(2.4+prog*1.6+(rnd()*1.6-0.8))));
    const en=Math.min(5,Math.max(1,Math.round(2.2+prog*1.6+(rnd()*1.6-0.8))));
    const fx=[]; if(rnd()<0.15*(1-prog)+0.03)fx.push("Brustspannen"); if(rnd()<0.08)fx.push("Kopfschmerzen"); if(rnd()<0.1)fx.push("Blähungen");
    D.days[d]={date:d,e:{on:eOn,p:i>40?1:2,t:"07:"+pad(10+Math.floor(rnd()*40)),s:SITES[Math.floor(rnd()*2)]},u:{on:uOn,mg:100,t:"22:"+pad(Math.floor(rnd()*50))},
      hf,sl,mo,en,bl:(i===48||i===47)?"spot":(i===20?"light":"none"),fx,note:i===41?"Dosis auf 2 Hübe erhöht (Rücksprache Praxis)":""};
  }
  const s0=[3,1,3,2,3,1,3,2,1,2,2], s1=[2,1,2,2,2,1,2,2,1,2,2], s2=[1,0,2,1,1,0,2,1,1,2,1], s3=[1,0,1,1,1,0,1,1,1,2,1];
  [[62,s0],[42,s1],[21,s2],[2,s3]].forEach(([i,s],k)=>D.mrs.push({id:"m-demo"+k,date:addDays(today(),-i),s,note:"",ts:k}));
  return D;
}

/* ---------- render ---------- */
function needsName(){return !demo&&!(S.settings.name||"").trim();}
function vOnboarding(){
  return `<section class="card stack welcome onboard" aria-label="Willkommen">
    <div class="eyebrow">Wechseljahre-Tagebuch</div>
    <h1>Willkommen</h1>
    <div class="small">Bevor es losgeht: Wie heisst du? Dein Vorname wird nur für die persönliche Begrüssung verwendet.</div>
    <form id="nameForm" class="stack" novalidate>
      <label class="f" for="obName">Dein Vorname<input type="text" id="obName" name="vorname" required maxlength="40" autocomplete="given-name" autocapitalize="words" enterkeyhint="done" aria-describedby="obHint obErr"></label>
      <div id="obErr" class="small" role="alert" style="color:var(--danger,#b3261e)"></div>
      <button class="btn primary" type="submit" style="align-self:flex-start">Weiter</button>
    </form>
    <div id="obHint" class="small muted">Der Name wird ausschliesslich auf diesem Gerät gespeichert. Es gibt keine Anmeldung und keine Übertragung an einen Server.</div>
  </section>`;
}
function render(){
  const app=document.getElementById("app");
  const tabs=document.getElementById("tabs");
  if(needsName()){
    app.innerHTML=vOnboarding(); tabs.innerHTML=""; tabs.parentNode.hidden=true;
    const f=document.getElementById("nameForm"), inp=document.getElementById("obName");
    f.addEventListener("submit",ev=>{ev.preventDefault();const n=inp.value.trim();
      if(!n){document.getElementById("obErr").textContent="Bitte gib deinen Vornamen ein.";inp.focus();return;}
      S.settings.name=n.slice(0,40); saveSettings(); render(); window.scrollTo(0,0);});
    setTimeout(()=>{try{inp.focus();}catch(e){}},50);
    return;
  }
  tabs.parentNode.hidden=false;
  const fn={heute:vHeute,kalender:vKalender,fragebogen:vFragebogen,analyse:vAnalyse,mehr:vMehr}[view]||vHeute;
  app.innerHTML=fn();
  tabs.innerHTML=TABS.map(([k,l])=>`<a href="#${k}" ${view===k?'aria-current="page"':""}>${IC[k]}<span>${l}</span></a>`).join("");
  const qf=document.getElementById("qForm");
  if(qf) qf.addEventListener("submit",ev=>{ev.preventDefault();const t=document.getElementById("qText").value.trim();if(!t)return;S.settings.questions.push({id:"q"+Date.now(),text:t,done:false});saveSettings();render();});
  const imp=document.getElementById("importFile");
  if(imp) imp.addEventListener("change",()=>{const f=imp.files&&imp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>importData(String(r.result));r.readAsText(f);});
}
function go(v){ if(location.hash!=="#"+v) location.hash=v; else {view=v;render();window.scrollTo(0,0);} }
function route(){
  const h=(location.hash||"").replace("#","");
  view=TABS.find(t=>t[0]===h)?h:"heute";
  render(); window.scrollTo(0,0);
}
window.addEventListener("hashchange",route);

/* ---------- actions ---------- */
function rerenderKeepScroll(){const y=window.scrollY;render();window.scrollTo(0,y);}
document.addEventListener("click",ev=>{
  const el=ev.target.closest("[data-action]"); if(!el) return;
  const a=el.dataset.action, v=el.dataset.v;
  if(el.tagName==="INPUT") return; // checkboxes handled on change
  const d=()=>ensureDay(cur);
  switch(a){
    case "closeModal": if(ev.target===el) document.getElementById("modal").innerHTML=""; return;
    case "dayPrev": cur=addDays(cur,-1); break;
    case "dayNext": if(cur<today()) cur=addDays(cur,1); break;
    case "goToday": cur=today(); break;
    case "welcomeOk": S.settings.welcomed=true; saveSettings(); break;
    case "toggleE": {const x=d(); x.e.on=!x.e.on; if(x.e.on){ if(!x.e.t&&cur===today()) x.e.t=nowTime(); if(!x.e.p) x.e.p=S.settings.estroPumps; if(!x.e.s) x.e.s=lastSite(); } saveDay(cur); break;}
    case "toggleU": {const x=d(); x.u.on=!x.u.on; if(x.u.on){ if(!x.u.t&&cur===today()) x.u.t=nowTime(); x.u.mg=x.u.mg||S.settings.utroMg; } saveDay(cur); break;}
    case "pumps": {const x=d(); x.e.p=Math.max(1,Math.min(6,(Number(x.e.p)||1)+Number(v))); saveDay(cur); break;}
    case "site": {const x=d(); x.e.s=x.e.s===v?"":v; saveDay(cur); break;}
    case "umg": {const x=d(); x.u.mg=Number(v); saveDay(cur); break;}
    case "hf": {const x=d(); const n=(x.hf==null?0:x.hf)+Number(v); x.hf=n<0?null:Math.min(40,n); if(x.hf==null&&Number(v)>0)x.hf=0; saveDay(cur); break;}
    case "scale": {const x=d(); const n=Number(v); x[el.dataset.k]=x[el.dataset.k]===n?null:n; saveDay(cur); break;}
    case "bleed": {const x=d(); x.bl=x.bl===v?"":v; saveDay(cur); break;}
    case "fx": {const x=d(); x.fx=x.fx||[]; x.fx=x.fx.includes(v)?x.fx.filter(y=>y!==v):x.fx.concat(v); saveDay(cur); break;}
    case "monPrev": {const [y,m]=calMonth.split("-").map(Number);const dt=new Date(y,m-2,1);calMonth=dt.getFullYear()+"-"+pad(dt.getMonth()+1);break;}
    case "monNext": {const [y,m]=calMonth.split("-").map(Number);const dt=new Date(y,m,1);const nm=dt.getFullYear()+"-"+pad(dt.getMonth()+1);if(nm<=today().slice(0,7))calMonth=nm;break;}
    case "openDay": cur=v; go("heute"); return;
    case "mrsNew": mrsDraft={id:"m-"+Date.now().toString(36)+Math.random().toString(36).slice(2,6),date:today(),s:Array(11).fill(null),note:"",existing:false}; window.scrollTo(0,0); break;
    case "mrsEdit": {const m=S.mrs.find(x=>x.id===v); if(m){mrsDraft=Object.assign(clone(m),{existing:true});window.scrollTo(0,0);} break;}
    case "mrsSet": mrsDraft.s[Number(el.dataset.i)]=Number(v); break;
    case "mrsCancel": mrsDraft=null; break;
    case "mrsSave": {const m={id:mrsDraft.id,date:mrsDraft.date||today(),s:mrsDraft.s.map(x=>x||0),note:mrsDraft.note||"",ts:Date.now()};
      S.mrs=S.mrs.filter(x=>x.id!==m.id).concat(m); saveMrs(m); mrsDraft=null; window.scrollTo(0,0); break;}
    case "mrsDelete": confirmBox("Diesen Fragebogen löschen?","Löschen",()=>{deleteMrs(mrsDraft.id);mrsDraft=null;render();}); return;
    case "goMrs": go("fragebogen"); return;
    case "goSettings": go("mehr"); setTimeout(()=>{const e=document.getElementById("einstellungen");if(e)e.scrollIntoView();},50); return;
    case "range": range=v==="all"?"all":Number(v); break;
    case "repRange": reportRange=v; break;
    case "copyReport": copyText(buildReport(),"copyMsg","Kopiert."); return;
    case "qDel": S.settings.questions=S.settings.questions.filter(q=>q.id!==v); saveSettings(); break;
    case "setPumps": S.settings.estroPumps=Number(v); saveSettings(); break;
    case "setUmode": S.settings.utroMode=v; saveSettings(); break;
    case "setUmg": S.settings.utroMg=Number(v); if(!S.settings.packDate) S.settings.packSize=Number(v)===200?15:30; saveSettings(); break;
    case "newBottle": S.settings.bottleDate=today(); saveSettings(); break;
    case "newPack": S.settings.packDate=today(); saveSettings(); break;
    case "exportData": copyText(JSON.stringify({app:"wj-tagebuch",v:1,exported:new Date().toISOString(),settings:S.settings,days:S.days,mrs:S.mrs}),"expMsg","Sicherung kopiert."); return;
    case "exportFile": downloadBackup(); return;
    case "importText": importData(document.getElementById("importText").value); return;
    case "demoOn": if(!demo){REAL=S;S=makeDemo();demo=true;go("analyse");} return;
    case "demoOff": if(demo){S=REAL;REAL=null;demo=false;mrsDraft=null;} break;
    default: return;
  }
  rerenderKeepScroll();
});
document.addEventListener("change",ev=>{
  const el=ev.target;
  if(el.dataset.action==="qDone"){const q=S.settings.questions.find(x=>x.id===el.dataset.v);if(q){q.done=el.checked;saveSettings();rerenderKeepScroll();}return;}
  if(el.dataset.set==="name"&&!el.value.trim()){el.value=S.settings.name||"";toast("Der Vorname darf nicht leer sein.");return;}
  if(el.dataset.set){const k=el.dataset.set; let val=el.dataset.set==="name"?el.value.trim().slice(0,40):el.value; if(el.type==="number") val=val===""?DEF_SETTINGS[k]:Number(val); S.settings[k]=val; saveSettings(); rerenderKeepScroll(); return;}
  if(el.dataset.field&&el.type==="time"){const x=ensureDay(cur);const [a,b]=el.dataset.field.split(".");x[a][b]=el.value;saveDay(cur);return;}
  if(el.dataset.mrs==="date"&&mrsDraft){mrsDraft.date=el.value;return;}
});
document.addEventListener("input",ev=>{
  const el=ev.target;
  if(el.dataset.field==="note"){const x=ensureDay(cur);x.note=el.value;lsSave();clearTimeout(savedTimer);savedTimer=setTimeout(flashSaved,1200);return;}
  if(el.dataset.mrs==="note"&&mrsDraft){mrsDraft.note=el.value;return;}
});
function lastSite(){
  const ks=Object.keys(S.days).filter(k=>k<cur&&S.days[k].e&&S.days[k].e.s).sort();
  return ks.length?S.days[ks[ks.length-1]].e.s:"Arme";
}
function downloadBackup(){
  const data={app:"wj-tagebuch",v:1,exported:new Date().toISOString(),settings:S.settings,days:S.days,mrs:S.mrs};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");a.href=url;a.download="wechseljahre-tagebuch-sicherung-"+today()+".json";
  document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);
  const e=document.getElementById("expMsg");if(e)e.textContent="Sicherungsdatei wurde erstellt.";
}
function copyText(txt,msgId,okMsg){
  const show=m=>{const e=document.getElementById(msgId);if(e)e.textContent=m;};
  try{
    navigator.clipboard.writeText(txt).then(()=>show(okMsg),()=>fallbackCopy(txt,show,okMsg));
  }catch(e){fallbackCopy(txt,show,okMsg);}
}
function fallbackCopy(txt,show,okMsg){
  const ta=document.createElement("textarea");ta.value=txt;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();
  let ok=false;try{ok=document.execCommand("copy");}catch(e){}
  ta.remove(); show(ok?okMsg:"Kopieren nicht möglich. Bitte Text manuell markieren.");
}
function importData(raw){
  let o; try{o=JSON.parse(raw);}catch(e){toast("Das sieht nicht nach einer gültigen Sicherung aus.");return;}
  if(!o||!o.days||!o.settings){toast("In dieser Sicherung fehlen Daten.");return;}
  if(demo){toast("Bitte zuerst die Beispieldaten beenden.");return;}
  confirmBox(`Sicherung mit ${Object.keys(o.days).length} Tagen und ${(o.mrs||[]).length} Fragebögen einlesen? Vorhandene Einträge an denselben Tagen werden überschrieben.`,"Einlesen",async()=>{
    Object.assign(S.days,o.days); const ids=new Set((o.mrs||[]).map(m=>m.id));
    S.mrs=S.mrs.filter(m=>!ids.has(m.id)).concat(o.mrs||[]);
    S.settings=mergeSettings(o.settings);
    lsSave(); render(); toast("Sicherung eingelesen.");

  });
}

/* ---------- boot ---------- */
route();
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(() => {}));
}
})();
</script>
